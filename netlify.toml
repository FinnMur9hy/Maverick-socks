# Static site — no build step. Netlify serves the repo root as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Serverless checkout. The function reads prices from products.json and talks to
# Stripe; STRIPE_SECRET_KEY is set in the Netlify UI, never in this repo.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
